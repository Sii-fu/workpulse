    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Noto+Sans+Bengali:wght@100..900&family=Plus+Jakarta+Sans:ital,wght@0,200..800;1,200..800&display=swap" rel="stylesheet" />
    <script>
      // Apply the saved theme before the first paint so there is no flash of the default theme.
      // Mirrors App.tsx: unknown values fall back to modern/dark, and matrix is always dark.
      (function () {
        try {
          var s = JSON.parse(localStorage.getItem('workpulse_settings') || '{}');
          var theme = ['modern', 'minimalist', 'compact', 'matrix'].indexOf(s.theme) >= 0 ? s.theme : 'modern';
          var mode = theme === 'matrix' ? 'dark'
            : s.colorMode === 'light' || s.colorMode === 'dark' ? s.colorMode
            : theme === 'minimalist' ? 'light' : 'dark';
          document.documentElement.setAttribute('data-theme', theme);
          document.documentElement.setAttribute('data-mode', mode);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
